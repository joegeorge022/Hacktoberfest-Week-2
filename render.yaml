services:
  - type: web
    name: hustlepulse-ai
    env: python
    region: oregon
    plan: starter
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: GEMMA_PROVIDER
        value: auto
      - key: GEMMA_MODEL
        value: gemma2:2b
      - key: TABPFN_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
